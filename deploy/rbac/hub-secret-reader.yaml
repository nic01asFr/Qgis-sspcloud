# P1-5 fix (2026-07-13) : Role + RoleBinding pour permettre au pod hub
# (statefulset qgis-mcp-bridge-jupyter-python) de lire le Secret
# `qgis-hub-apikey` via l'API K8s HTTP.
#
# Bug detecte en validation Sprint V0.3 (namespace user-nic01asfr) :
# - Le SA du pod n'avait pas de RoleBinding avec `get secrets` sur le Secret
# - `_k8s_get_secret_value` retournait 403 silencieusement -> None
# - `create_or_get_api_key` tombait en fallback DB legacy volatile
# - La cle DB volatile divergait de HUB_API_KEY (Secret injecte via env)
# - `_is_inter_pod_authorized` comparait presented (env agent) vs expected
#   (DB volatile) -> jamais egal -> 401 Unauthorized sur tout inter-pod
#   (fetch briques, execute recipe, etc.)
#
# Application :
#   kubectl -n user-<USER> apply -f deploy/rbac/hub-secret-reader.yaml
#
# Automatiser : ce manifest devrait etre inclus dans le chart Helm hub
# (chart onyxia qgis-mcp-bridge) pour eviter la config manuelle a chaque
# deploy. Ticket suivi : voir memory reference_nicolaslaval_hub_deploy_datamodel.
#
# Nota : le Role est nomme (par ressource) pour respecter le principe
# de moindre privilege. Le pod ne peut lire QUE `qgis-hub-apikey`, pas
# les autres Secrets du namespace (ex: llm-api-key, kube-tokens...).
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hub-secret-reader
  labels:
    app.kubernetes.io/component: qgis-hub
    app.kubernetes.io/managed-by: manual-rbac-fix
    fix: sprint-v03-p1-5
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["qgis-hub-apikey"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hub-secret-reader
  labels:
    app.kubernetes.io/component: qgis-hub
    app.kubernetes.io/managed-by: manual-rbac-fix
    fix: sprint-v03-p1-5
subjects:
  # SA par defaut du pod jupyter-python (StatefulSet Onyxia).
  # Vraie identite du SA a verifier par `kubectl get pod qgis-mcp-bridge-jupyter-python-0 -o yaml | grep serviceAccountName`.
  - kind: ServiceAccount
    name: default
    # Le SA est dans le meme namespace que le RoleBinding (implicite).
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hub-secret-reader
