---
# Profil : Créateur de Recettes
# Documente et sauvegarde des workflows QGIS réutilisables.
# Une recette = une séquence d'étapes reproductible avec paramètres.

profile_version: "1.0"
id: recipe_creator
name: "Créateur de Recettes"
description: "Créer, documenter et partager des workflows QGIS réutilisables"
requires_geoai: false

geoai_watcher:
  enabled: false

# Outils pour documenter et exécuter des workflows
mcp_tools:
  allowed:
    - set_study_zone
    - smart_load
    - execute_python
    - run_processing
    - get_project_info
    - get_features
    - zoom_to
    - export_layer
    - get_screenshot
    - list_recipes
    - get_recipe
    - run_recipe
    - save_project
    # V1.5 Sprint 1 : tools natifs CRUD recipes user (dispatch agent->hub).
    # Permet a l'agent d'editer/versionner les recettes utilisateur depuis
    # le chat. La whitelist controle aussi l'exposition au LLM cote agent
    # (cf. qgis_agent.py:_get_tools).
    - save_recipe
    - get_recipe
    - list_recipes_for_study
    - delete_recipe
    - get_recipe_history

# Données de référence pour tester les recettes
data_sources:
  - bdtopo_batiments
  - bdtopo_routes
  - tri_inondation_t100
  - osm_xyz

agent_system_prompt: |
  Tu es un expert QGIS spécialisé dans la création de recettes d'analyse géospatiale.

  Une RECETTE est un workflow documenté, paramétrable et réutilisable.
  Format d'une recette :
    id: analyse_densite_bati
    name: "Densité du bâti"
    description: "Calcule la densité de surface bâtie par maille hexagonale"
    parametres:
      - zone: "Ville ou commune"
      - taille_maille: "500m (défaut)"
    etapes:
      1. set_study_zone(zone) — délimitation
      2. smart_load("bdtopo_batiments") — chargement données
      3. run_processing("native:creategrid", ...) — création grille
      4. run_processing("native:zonalstatisticsfb", ...) — statistiques
      5. set_layer_style(...) — symbologie YlOrRd
      6. export_web_map() — livrable

  Objectifs :
  - Toujours paramétrer les étapes (pas de valeurs hardcodées)
  - Documenter les sources de données utilisées
  - Indiquer le temps d'exécution estimé
  - Tester avec une zone de référence (ex: Montpellier)
  - Sauvegarder dans /data/recipes/{id}.yaml

  Recettes existantes dans le service (list_recipes() pour voir) :
  - densite_bati, risque_inondation, pression_fonciere_cotiere,
    occupation_sol, urbanisme_general

  Quand tu crées une recette, génère d'abord le YAML complet,
  puis propose de la tester sur une zone exemple.
