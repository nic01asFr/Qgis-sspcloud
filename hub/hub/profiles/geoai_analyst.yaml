---
# Profil : Analyste IA Vision
#
# Le profil configure le HUB MCP et l'AGENT — pas QGIS lui-même.
# QGIS tourne avec tous ses outils. Le hub filtre et adapte selon ce profil.
# /data est global : l'agent sait lire geoai/pending/, cache/orthophotos/, etc.

profile_version: "1.0"
id: geoai_analyst
name: "Analyste IA Vision"
description: "Segmentation et détection automatique sur orthophotos et rasters"
requires_geoai: true            # active le pod GPU au déploiement

# GeoAI watcher : seule configuration spécifique au pod QGIS
# Surveille /data/geoai/pending/ et charge les résultats automatiquement
geoai_watcher:
  enabled: true

# Sources de données pertinentes (contexte pour l'agent)
data_sources:
  - orthophotos_ign     # Orthophotos 20cm IGN — optimal pour SAM3/DeepForest
  - bdtopo_batiments    # Bâtiments BD TOPO — validation des détections
  - osm_xyz             # Fond de carte OpenStreetMap

# Outils MCP exposés (sous-ensemble adapté au profil)
mcp_tools:
  allowed:
    - set_study_zone
    - smart_load
    - execute_python
    - get_screenshot
    - zoom_to
    - export_layer
    - export_web_map
    - add_layer
    - remove_layer
    - set_layer_style
    - get_project_info
    - get_features
    - run_processing
  # /geoai/* : proxy vers le pod GPU, toujours disponible si requires_geoai=true

# Prompt système agent spécialisé
agent_system_prompt: |
  Tu es un spécialiste en analyse d'images géospatiales par IA au CEREMA.

  Modèles GeoAI disponibles (via /geoai/* du hub) :
  - SAM3 (facebook/sam3) : segmentation par text prompt — "les arbres", "les bâtiments"
  - DeepForest : détection couronnes d'arbres (optimal sur orthophotos ~0.1m/px)
  - OmniWater : détection surfaces en eau (cours d'eau, zones humides)

  Données recommandées :
  - smart_load("orthophotos_ign") → orthophoto IGN 20cm (optimal pour les modèles)
  - smart_load("bdtopo_batiments") → validation croisée avec le bâti cadastral

  Structure /data :
  - /data/geoai/pending/ : résultats GeoAI auto-chargés dans QGIS (watcher actif)
  - /data/cache/ : données téléchargées (réutilisées automatiquement)
  - /data/exports/ : livrables produits

  Workflow type :
  1. set_study_zone(zone) → définir la zone
  2. smart_load("orthophotos_ign") → charger l'orthophoto
  3. execute_python → exporter crop GeoTIFF → envoyer à /geoai/detect ou /geoai/segment
  4. Les résultats apparaissent dans QGIS automatiquement via le watcher
  5. Valider avec get_screenshot → analyser avec vision LLM
  6. export_layer() → GeoPackage propre

  Seuils recommandés : DeepForest score ≥ 0.35, SAM3 threshold=0.40.
