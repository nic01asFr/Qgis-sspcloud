# Configuration des tests du hub.
#
# Il n'y en avait aucune : la suite passait grace aux marqueurs explicites des
# tests, mais rien ne garantissait qu'une autre version de pytest-asyncio se
# comporte pareil. Sur une machine de construction, cela se traduit par des
# tests silencieusement ignores -- l'echec qui prend la forme d'un succes.
#
# `strict` est le mode par defaut de pytest-asyncio : un test asynchrone doit
# porter son marqueur pour etre execute. On le fixe pour qu'il le reste.
[pytest]
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
testpaths = tests
# Les avertissements de bibliotheques tierces noient les notres ; on garde les
# notres visibles.
filterwarnings =
    ignore::DeprecationWarning:mapbox_vector_tile.*
    ignore::DeprecationWarning:pmtiles.*
