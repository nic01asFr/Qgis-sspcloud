# Correctif « agir au lieu de decrire » (2026-10-02), production du 28-30/09.
# Densite batie par l'outil dedie : constat live du 2026-10-02.
id: C7-agir-tvb-rousset
famille: conversation
titre: « Sur Rousset, affiche les trames vertes et bleues, la densité bâtie et les réseaux »
source: production 28-30/09, 28 tours ; correctif agir au lieu de decrire ; live 2026-10-02
description: >
  Demande vague mais executable. En production, l'agent repondait « Voici mon
  plan : 1. ... » ou « [Je lance d'abord la recherche de sources...] » sans
  aucun appel d'outil, et l'utilisateur devait relancer par « Ok »,
  « continue », « alors ? ». Attendu : des appels d'outils des le premier
  tour (zone puis chargement), des choix de sources annonces en une phrase,
  ni plan a valider ni action narree entre crochets. Le 2026-10-02, les
  chargements etaient corrects, mais la densite batie par maille a ete
  ecrite trois fois en PyQGIS, la derniere execution au-dela de 12 minutes
  (boucle entite par entite) : la densite doit passer par densite_par_maille
  (ou compter_par_zone), en quelques secondes.
preconditions:
  vider_projet: true
tours:
  - message: Sur Rousset, affiche les trames vertes et bleues, la densité bâtie et les réseaux
attentes:
  trajectoire:
    outils_attendus:
      - set_study_zone
      - un_de: [smart_load, add_from_catalog]
      - un_de: [densite_par_maille, compter_par_zone]
    ordre:
      - [set_study_zone, {un_de: [smart_load, add_from_catalog]}]
      - [{un_de: [smart_load, add_from_catalog]}, {un_de: [densite_par_maille, compter_par_zone]}]
    max_erreurs_outils: 3
    max_execute_python: 1
  etat:
    zone:
      nom_contient: Rousset
    couches:
      - motif: "densit"
        presente: true
  reponse:
    ne_doit_pas_contenir:
      - 'voici\s+(mon|le)\s+plan'
      - 'je\s+lance\s+avec\s+ces\s+d[ée]fauts'
      - '(?m)^[ \t]*\[[^\]\n]{3,}\][ \t]*$'
    mots_interdits: [execute_python, smart_load, set_study_zone, densite_par_maille,
                     compter_par_zone, pyqgis, mcp, bridge]
  cout:
    iterations_max: 12
    duree_max_s: 900
