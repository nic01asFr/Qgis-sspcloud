name: Build & Push Docker images

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OWNER: nic01asfr

jobs:
  build-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push qgis-agent
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.agent
          push: true
          # Sprint V0.2 (2026-07-10) : ajout tag :main mobile en parallele
          # de :latest. Sur certains nodes K8s SSPCloud, le cache local du
          # tag :latest ne se met pas a jour malgre pullPolicy=Always. Le
          # tag :main (sur commit main) est immutable par identifiant mais
          # se rafraichit a chaque push main -> force le re-pull sans avoir
          # a utiliser le sha long.
          tags: |
            ghcr.io/${{ env.OWNER }}/qgis-agent:latest
            ghcr.io/${{ env.OWNER }}/qgis-agent:main
            ghcr.io/${{ env.OWNER }}/qgis-agent:${{ github.sha }}

      # Smoke test post-build : verifie que les imports critiques ne sont pas
      # casses. Sans cela, un commit avec import circulaire ou typo nom module
      # passe le build (Docker ne lance pas le code) et casse le pod au demarrage.
      - name: Smoke test imports
        run: |
          docker run --rm --entrypoint python \
            ghcr.io/${{ env.OWNER }}/qgis-agent:${{ github.sha }} \
            -c "import agent.main; import agent.qgis_agent; print('agent imports OK')"

  build-hub:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push qgis-hub
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.hub
          push: true
          # Sprint V0.2 (2026-07-10) : voir commentaire build-agent ci-dessus
          # sur le tag :main mobile qui contourne le cache node :latest.
          tags: |
            ghcr.io/${{ env.OWNER }}/qgis-hub:latest
            ghcr.io/${{ env.OWNER }}/qgis-hub:main
            ghcr.io/${{ env.OWNER }}/qgis-hub:${{ github.sha }}

      - name: Smoke test imports
        run: |
          docker run --rm --entrypoint python \
            ghcr.io/${{ env.OWNER }}/qgis-hub:${{ github.sha }} \
            -c "import hub.main; print('hub imports OK')"

  # build-workspace : image QGIS Desktop (ubuntu + QGIS complet ~30min).
  # Buildée manuellement depuis BigQgisMCP, disponible sur ghcr.io/nic01asfr/qgisremotemcp:latest.
  # Décommenter ce job uniquement pour rebuilder (ex: màj plugins QGIS).
  #
  # build-workspace:
  #   runs-on: ubuntu-latest
  #   if: false  # manuel uniquement
  #   ...voir Dockerfile.workspace
