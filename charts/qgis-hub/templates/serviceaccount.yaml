apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "qgis-hub.fullname" . }}
  labels:
    {{- include "qgis-hub.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "qgis-hub.fullname" . }}
  labels:
    {{- include "qgis-hub.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.kubernetes.role }}
subjects:
  - kind: ServiceAccount
    name: {{ include "qgis-hub.fullname" . }}
    namespace: {{ .Release.Namespace }}
