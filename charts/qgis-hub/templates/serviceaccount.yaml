{{/*
Sprint Day 5 Phase 1.5 fix (2026-08-04) : SUPPRESSION du RoleBinding qui
bloquait `helm install` cote user (RBAC SSPCloud : users OIDC ne peuvent
manipuler roles.rbac.authorization.k8s.io. Doc memoire :
[[reference_sspcloud_rbac_namespace]]).

Le namespace user-{X} a deja un ServiceAccount `default` provisionne par
Onyxia avec les droits necessaires (via kubernetes.role setting de l'API
Onyxia lors du deploiement du service). Les pods utilisent ce SA par
defaut - pas besoin de creer un SA custom + RoleBinding.

Ce fichier est conserve vide pour retro-compat mais n'ajoute plus de
resources RBAC.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "qgis-hub.fullname" . }}
  labels:
    {{- include "qgis-hub.labels" . | nindent 4 }}
