{{/*
Sprint Day 5 Phase 1.2 (2026-08-04) : Role + RoleBinding qui permet au
ServiceAccount du chart de lire le Secret `qgis-hub-apikey` (necessaire
pour les tools workspace + agent + hub qui l'utilisent via secretKeyRef
+ pour le hub `create_or_get_api_key` fallback en cas de suppression).

Absorbe le manifest historique `deploy/rbac/hub-secret-reader.yaml` du
repo racine (commentaire explicite du fichier : "devrait etre inclus dans
le chart Helm hub"). Le chart le rend enfin natif.

Scope resourceName limite a `qgis-hub-apikey` -> defense en profondeur (le
SA ne peut lire aucun autre Secret que celui-la, meme s'il est compromis).
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "qgis-hub.fullname" . }}-secret-reader
  labels:
    {{- include "qgis-hub.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["qgis-hub-apikey"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "qgis-hub.fullname" . }}-secret-reader
  labels:
    {{- include "qgis-hub.labels" . | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: {{ include "qgis-hub.fullname" . }}
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "qgis-hub.fullname" . }}-secret-reader
  apiGroup: rbac.authorization.k8s.io
