{{/*
Sprint Day 5 Phase 1.2 (2026-08-04) : Secret HUB_API_KEY genere par le chart.

Absorbe la fonction runtime `auth.create_or_get_api_key()` qui creait ce
Secret via K8s API au 1er acces si absent. Avec ce template, le Secret existe
des `helm install` -> le hub, l'agent et le workspace peuvent le lire des
leur premier boot via secretKeyRef.

Format cle : `qgis_{ONYXIA_USER}_{hex32}` pour matcher `_validate_api_key`
(auth.py:414) qui compare strictement le format.

Protection : `helm.sh/resource-policy: keep` = jamais delete par Helm sur
uninstall (evite de perdre les cles user existantes en cas d'accident helm
uninstall + reinstall). Meme pattern que PVC hub.

Idempotence : `pre-install,pre-upgrade` hooks avec `hook-delete-policy:
before-hook-creation` (= si Secret existe deja, ne pas le recreer). Le hub
`create_or_get_api_key` continue de fonctionner en fallback runtime si le
Secret venait a manquer (self-heal).
*/}}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace "qgis-hub-apikey" }}
{{- if not $existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: qgis-hub-apikey
  labels:
    {{- include "qgis-hub.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  {{- $username := .Values.oidc.username | default (.Release.Namespace | trimPrefix "user-") }}
  {{- $random := randAlphaNum 32 }}
  HUB_API_KEY: {{ printf "qgis_%s_%s" $username $random | b64enc | quote }}
{{- end }}
