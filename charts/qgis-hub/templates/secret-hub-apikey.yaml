{{/*
Sprint Day 5 Phase 1.2 (2026-08-04) : Secret HUB_API_KEY genere par le chart.

Absorbe la fonction runtime `auth.create_or_get_api_key()` qui creait ce
Secret via K8s API au 1er acces si absent. Avec ce template, le Secret existe
des `helm install` -> le hub, l'agent et le workspace peuvent le lire des
leur premier boot via secretKeyRef.

Format cle : `qgis_{ONYXIA_USER}_{hex32}` pour matcher `_validate_api_key`
(auth.py:414) qui compare strictement le format.

Protection : `helm.sh/resource-policy: keep` = jamais delete par Helm sur
uninstall (evite de perdre les cles user existantes en cas d'accident helm
uninstall + reinstall). Meme pattern que PVC hub.

Idempotence : `pre-install,pre-upgrade` hooks avec `hook-delete-policy:
before-hook-creation` (= si Secret existe deja, ne pas le recreer). Le hub
`create_or_get_api_key` continue de fonctionner en fallback runtime si le
Secret venait a manquer (self-heal).
*/}}
{{/*
Correctif 2026-08-22 (chart 1.3.0) : la cle peut desormais etre FOURNIE.

Avant, elle etait toujours tiree au sort par le chart et n'existait que
dans ce Secret. Consequences pour l'utilisateur :
  - impossible de la retrouver sans `kubectl get secret`, donc sans un
    Jupyter en role edit ;
  - invisible dans l'interface Onyxia, qui n'affiche que les values ;
  - le `lookup` ci-dessous exige `get secrets`, ce qui faisait echouer
    l'installation depuis un Jupyter au role par defaut (view).

Desormais install.sh genere la cle (ou relit celle deja en place) et la
passe via `security.apiKey`. Elle apparait alors dans les values Helm et
dans les notes d'installation -- donc dans Onyxia > Mes services, comme
le mot de passe du chart Jupyter officiel. Plus aucun jeton a retrouver.

Le tirage aleatoire reste en repli pour les installations qui ne passent
pas par install.sh. Dans ce cas seulement, `lookup` sert a ne pas
regenerer une cle a chaque upgrade (ce qui invaliderait les cookies 90j).
*/}}
{{- $username := .Values.oidc.username | default (.Release.Namespace | trimPrefix "user-") }}
{{- $provided := (.Values.security).apiKey | default "" | trim }}
{{- if $provided }}
apiVersion: v1
kind: Secret
metadata:
  name: qgis-hub-apikey
  labels:
    {{- include "qgis-hub.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  HUB_API_KEY: {{ $provided | quote }}
{{- else }}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace "qgis-hub-apikey" }}
{{- if not $existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: qgis-hub-apikey
  labels:
    {{- include "qgis-hub.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  {{- $random := randAlphaNum 32 }}
  HUB_API_KEY: {{ printf "qgis_%s_%s" $username $random | b64enc | quote }}
{{- end }}
{{- end }}
