apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "qgis-hub.fullname" . }}
  labels:
    {{- include "qgis-hub.labels" . | nindent 4 }}
spec:
  replicas: 1
  serviceName: {{ include "qgis-hub.fullname" . }}
  selector:
    matchLabels:
      {{- include "qgis-hub.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "qgis-hub.selectorLabels" . | nindent 8 }}
    spec:
      {{- /* Sprint Day 5 fix 2026-08-06 : SA heritee du pod jupyter Onyxia
             qui a le RoleBinding ClusterRole `edit` (provisionne par Onyxia
             au moment de creer le service jupyter). La SA custom `qgis-hub`
             et la SA `default` du namespace n'ont AUCUN droit car les users
             OIDC SSPCloud ne peuvent pas creer de RoleBinding (Phase 1.5).
             install.sh detecte KUBERNETES_SERVICE_ACCOUNT du pod jupyter
             courant et l'inject via values-user.yaml. Sans cette SA, le
             hub kubectl scale workspace echoue Forbidden -> UI 'Bureau
             endormi' permanent + bouton 'Reveiller' inoperant. */}}
      serviceAccountName: {{ .Values.serviceAccount.name | default (include "qgis-hub.fullname" .) }}
      securityContext:
        fsGroup: 100
      {{- if .Values.persistence.enabled }}
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: {{ include "qgis-hub.fullname" . }}
      {{- end }}
      containers:
        - name: hub
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/opt/python/bin/uvicorn"]
          args:
            - "hub.main:app"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8888"
            - "--log-level"
            - "info"
          ports:
            - name: http
              containerPort: 8888
              protocol: TCP
          env:
            - name: KUBERNETES_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: HUB_INTERNAL_PORT
              value: "8888"
            - name: DATA_DIR
              value: /home/onyxia/work/qgis-hub-data
            - name: ONYXIA_USER
              value: {{ .Values.oidc.username | quote }}
            {{- /* Sprint Day 5 Phase 1.7-A (2026-08-05) : Fix RBAC racine.
                   Le hub lit HUB_API_KEY via env var (kubelet injecte depuis
                   Secret K8s qgis-hub-apikey) au lieu de via K8s API (qui
                   necessitait RoleBinding get secrets - retire Phase 1.5
                   pour eviter forbidden install user). Pattern identique
                   agent + workspace. Source unique = Secret K8s chart-managed. */}}
            - name: HUB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: qgis-hub-apikey
                  key: HUB_API_KEY
            {{- if .Values.s3.enabled }}
            - name: AWS_ACCESS_KEY_ID
              value: {{ .Values.s3.accessKeyId | quote }}
            - name: AWS_SECRET_ACCESS_KEY
              value: {{ .Values.s3.secretAccessKey | quote }}
            - name: AWS_SESSION_TOKEN
              value: {{ .Values.s3.sessionToken | quote }}
            - name: AWS_ENDPOINT_URL
              value: "https://{{ .Values.s3.endpoint }}/"
            - name: AWS_DEFAULT_REGION
              value: {{ .Values.s3.defaultRegion | quote }}
            - name: AWS_WORKING_DIRECTORY_PATH
              value: {{ .Values.s3.workingDirectoryPath | quote }}
            {{- end }}
            {{- if .Values.vault.enabled }}
            - name: VAULT_ADDR
              value: {{ .Values.vault.url | quote }}
            - name: VAULT_TOKEN
              value: {{ .Values.vault.token | quote }}
            - name: VAULT_TOP_DIR
              value: {{ .Values.vault.directory | quote }}
            - name: VAULT_MOUNT
              value: {{ .Values.vault.mount | quote }}
            {{- end }}
            {{- /* Sprint Day 5 Phase 2-1 (2026-08-05) : SECURITY_PASSWORD
                   RETIRE. Le password chart-genere Phase 1.6 est remplace
                   par un unique credential HUB_API_KEY (Secret K8s injecte
                   ci-dessus). L'user tape sa cle API dans /login form.
                   Simplification : 1 credential, 1 flow. Cf. Phase 2-1. */}}
          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - name: home
              mountPath: /home/onyxia/work
          {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: 8888
            initialDelaySeconds: 15
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /health
              port: 8888
            failureThreshold: 60
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
