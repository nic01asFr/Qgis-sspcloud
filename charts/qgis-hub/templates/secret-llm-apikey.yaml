{{/*
Correctif 2026-08-22 (chart 1.3.0) : Secret dedie a la cle LLM de l'agent.

Probleme corrige
----------------
Avant cette version, la cle LLM etait injectee en clair comme value Helm
(`LLM_API_KEY: {{ .Values.llm.apiKey }}` dans agent-statefulset.yaml) et le
formulaire /workspace ne l'ecrivait qu'en RAM du pod agent. Resultat : la
cle disparaissait au premier redemarrage du pod (constat terrain sur
l'instance de reference : has_llm_key=false 16 jours apres une
configuration validee), et elle etait lisible via `helm get values`.

Solution
--------
Un Secret K8s `qgis-llm-apikey` devient la source de verite. Il est
alimente par deux chemins qui ne se marchent pas dessus :

  - a l'installation : ce template, si `llm.apiKey` est fourni (via
    install.sh qui lit le profil Vault de l'utilisateur, ou via l'UI
    Onyxia qui resout {{ai.activeProvider.apiKey}}) ;
  - a chaud : POST /workspace/llm-key cote hub, qui fait un merge-patch
    sur ce meme Secret puis appelle le webhook agent pour la propagation
    immediate (cf. hub/hub/main.py:workspace_set_llm_key).

L'agent lit le Secret via secretKeyRef `optional: true` : absent, le pod
demarre quand meme et l'UI affiche le bandeau invitant a configurer.

Pattern repris de la library-chart Onyxia officielle (_secret_ia.tpl), qui
cree de la meme facon un Secret `<release>-secretia` portant OPENAI_API_KEY
et OPENAI_BASE_URL.

Garde-fou : le template ne s'active que si `llm.apiKey` est non vide. Sans
cette condition, un `helm upgrade` sans valeur ecraserait avec une chaine
vide la cle que l'utilisateur vient de saisir dans le formulaire.

`resource-policy: keep` : jamais supprime par `helm uninstall`, comme le
Secret HUB_API_KEY et les PVC.
*/}}
{{- $apiKey := include "qgis-hub.llm.apiKey" . }}
{{- if $apiKey }}
apiVersion: v1
kind: Secret
metadata:
  name: qgis-llm-apikey
  labels:
    {{- include "qgis-hub.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  LLM_API_KEY: {{ $apiKey | quote }}
{{- end }}
