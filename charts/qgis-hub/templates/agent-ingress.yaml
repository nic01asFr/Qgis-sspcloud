{{- if and .Values.agent.enabled .Values.agent.ingress.enabled }}
{{/* Sprint Day 5 Phase 1.2 : Ingress agent avec proxy-read-timeout 600s
     necessaire pour le flux SSE du chat LLM (streaming reponse peut durer
     >60s). Hostname derive du hub hostname avec suffixe -agent. Miroir de
     l'ingress cree par _bootstrap_agent (main.py:469-492). */}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: qgis-agent
  labels:
    {{- include "qgis-hub.labels" . | nindent 4 }}
    app: qgis-agent
  annotations:
    kubernetes.io/ingress.class: {{ .Values.ingress.ingressClassName | default "onyxia" }}
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
spec:
  ingressClassName: {{ .Values.ingress.ingressClassName | default "onyxia" }}
  rules:
  - host: {{ .Values.agent.ingress.hostname | default (printf "%s-agent" (.Values.ingress.hostname | replace "-qgis." "-qgis-agent." | replace ".user.lab.sspcloud.fr" ".user.lab.sspcloud.fr")) }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: qgis-agent-svc
            port:
              number: 8888
{{- end }}
