{{/*
Correctif 2026-09-26 (audit securite des acces, SEC-4) : identifiants S3 dans
un Secret Kubernetes.

Avant, les trois identifiants S3 (et le jeton Vault) etaient poses en `value:`
dans le spec du StatefulSet du hub : quiconque pouvait lire le StatefulSet
(`kubectl get sts -o yaml`, role `view`) lisait les secrets, sans le droit
`get secrets`. Ils sont desormais dans ce Secret et lus via `secretKeyRef`.

Les valeurs restent celles que pose Onyxia (s3.accessKeyId, ...), si bien que
l'installation par defaut ne change pas.

Ce Secret ne sert que d'amorce. La source de verite des identifiants S3 est
le fichier `secrets/s3.env` du PVC du hub (droits 0600, cf.
hub/hub/secrets_pvc.py) : le hub le remplit au premier demarrage a partir de
ce Secret (ou du Secret passerelle-s3-creds), puis a chaque renouvellement
depuis l'interface. Aucune dependance a Vault. Une installation qui gere deja ses
identifiants dans un Secret le designe par `s3.existingSecret` (cles
AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_SESSION_TOKEN) : le chart n'en
cree alors aucun.

Pas de `lookup` ici : il exigerait `get secrets`, que le role par defaut d'un
Jupyter Onyxia n'a pas (cf. secret-hub-apikey.yaml).
*/}}
{{- if and .Values.s3.enabled (not .Values.s3.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "qgis-hub.fullname" . }}-s3
  labels:
    {{- include "qgis-hub.labels" . | nindent 4 }}
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: {{ .Values.s3.accessKeyId | default "" | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.s3.secretAccessKey | default "" | quote }}
  AWS_SESSION_TOKEN: {{ .Values.s3.sessionToken | default "" | quote }}
{{- end }}
