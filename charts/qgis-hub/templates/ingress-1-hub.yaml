{{/*
Correctif 2026-08-22 : le nom de ce fichier porte un numero d'ordre.

Onyxia construit la liste d'URLs d'un service en parcourant les Ingress du
manifeste Helm, SANS les trier (cf. ServiceUrlResolver.getServiceUrls dans
onyxia-api : `client.load(manifest).items()` puis boucle directe). La
premiere URL trouvee devient le lien "Ouvrir" de l'interface.

Or Helm assemble le manifeste dans l'ordre alphabetique des fichiers de
templates. Avec les anciens noms (`agent-ingress.yaml` et `ingress.yaml`),
l'agent passait devant : le bouton "Ouvrir" d'Onyxia envoyait l'utilisateur
sur le chat au lieu du bureau de travail.

D'ou `ingress-1-hub.yaml` et `ingress-2-agent.yaml` : l'ordre devient
explicite et le hub reste l'URL principale. Renommer les fichiers ne change
aucun nom de ressource Kubernetes -- aucun impact sur le deploiement.
*/}}
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "qgis-hub.fullname" . }}
  labels:
    {{- include "qgis-hub.labels" . | nindent 4 }}
  annotations:
    # Timeouts longs pour run_recipe (~5 min), smart_load BD TOPO (~2 min),
    # SSE streaming chat agent. Sans ces 4 annotations, les requêtes
    # tombent en 504 Gateway Timeout au bout de 60s (défaut nginx-ingress).
    # Cohérent avec _patch_own_ingress_timeout() dans hub/hub/main.py qui
    # self-heal les ingress Onyxia (chart launcher) au démarrage du hub.
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
spec:
  ingressClassName: {{ .Values.ingress.ingressClassName }}
  rules:
    - host: {{ .Values.ingress.hostname }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "qgis-hub.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
