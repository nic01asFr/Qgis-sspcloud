# qgis-hub chart values
# Sprint Day 5 Phase 1.2 (2026-08-04) : etendu pour deployer les 3 pods
# (hub + agent + workspace) via un seul `helm install`, remplaçant le
# portail nic01asfr.

image:
  repository: ghcr.io/nic01asfr/qgis-hub
  tag: latest
  pullPolicy: Always

service:
  port: 8888

ingress:
  enabled: true
  # Onyxia injecte le hostname automatiquement via values.schema.json
  # (pattern x-onyxia.overwriteDefaultWith)
  hostname: ""
  ingressClassName: onyxia

persistence:
  enabled: true
  size: 10Gi

kubernetes:
  role: edit

resources:
  requests:
    cpu: 100m
    memory: 2Gi
  limits:
    cpu: 4000m
    memory: 8Gi

# Onyxia injecte ces valeurs automatiquement depuis Vault/S3
oidc:
  username: ""

s3:
  enabled: true
  endpoint: minio.lab.sspcloud.fr
  defaultRegion: us-east-1
  accessKeyId: ""
  secretAccessKey: ""
  sessionToken: ""
  workingDirectoryPath: ""

vault:
  enabled: true
  url: https://vault.lab.sspcloud.fr
  mount: onyxia-kv
  token: ""
  directory: ""

git:
  enabled: true
  name: ""
  email: ""
  token: ""

security:
  # Sprint Day 5 Phase 1.6 : password bootstrap (Option B, pattern SSPCloud).
  # Le user tape ce password au 1er acces web (/login-password form POST).
  # Vide -> chart genere randAlphaNum 16 au moment de l'install (via
  # values.schema.json + Onyxia UI auto-fill). Visible dans Onyxia UI
  # onglet "Values de Helm" post-install.
  password: ""
  networkPolicy:
    enabled: true
    from:
      - ipBlock:
          cidr: 10.233.103.0/32
      - ipBlock:
          cidr: 10.233.111.0/32
      - ipBlock:
          cidr: 10.233.116.0/32
      - ipBlock:
          cidr: 10.233.108.0/32

global:
  suspend: false

message:
  fr: "**NB:** ce service pourrait être supprimé après 7 jours d'utilisation."
  en: "**Warning:** this service may be deleted after 7 days."

# ── Sprint Day 5 Phase 1.2 : nouveaux blocs agent + workspace + llm ──────────

# Agent LLM (chat + tool-runner)
agent:
  enabled: true
  image:
    repository: ghcr.io/nic01asfr/qgis-agent
    tag: latest
    pullPolicy: Always
  persistence:
    size: 10Gi
  ingress:
    enabled: true
    # Hostname derive du hub hostname par defaut (user-X-qgis-agent.*)
    hostname: ""
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi

# Workspace QGIS Desktop (noVNC + BigQgisMCP)
workspace:
  enabled: true
  image:
    repository: ghcr.io/nic01asfr/qgisremotemcp
    tag: latest
    pullPolicy: Always
  persistence:
    size: 10Gi
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: 2000m
      memory: 4Gi

# Cle LLM (SSPCloud llm.lab.sspcloud.fr par defaut, ou custom)
llm:
  # A remplir par l'user dans Onyxia UI. Peut aussi etre injecte depuis
  # Vault via x-onyxia dans values.schema.json (userProfileValues.aiAssistant.apiKey)
  apiKey: ""
  baseUrl: "https://llm.lab.sspcloud.fr/api"
  model: ""
