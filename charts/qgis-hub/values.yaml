# qgis-hub chart values
# Sprint Day 5 Phase 1.2 (2026-08-04) : etendu pour deployer les 3 pods
# (hub + agent + workspace) via un seul `helm install`, remplaçant le
# portail nic01asfr.

image:
  repository: ghcr.io/nic01asfr/qgis-hub
  tag: latest
  pullPolicy: Always

service:
  port: 8888

ingress:
  enabled: true
  # Onyxia injecte le hostname automatiquement via values.schema.json
  # (pattern x-onyxia.overwriteDefaultWith)
  hostname: ""
  ingressClassName: onyxia

persistence:
  enabled: true
  size: 10Gi

kubernetes:
  role: edit

# Sprint Day 5 fix 2026-08-06 : SA heritee du pod jupyter user
# (ClusterRole edit provisionne Onyxia). Sans ca, hub kubectl scale
# workspace echoue Forbidden -> UI "Bureau endormi" permanent.
# install.sh detecte KUBERNETES_SERVICE_ACCOUNT et l'inject ici.
# Valeur par defaut "default" ne marche PAS (SA sans droits).
serviceAccount:
  name: ""

resources:
  requests:
    cpu: 100m
    memory: 2Gi
  limits:
    cpu: 4000m
    memory: 8Gi

# Onyxia injecte ces valeurs automatiquement depuis Vault/S3
oidc:
  username: ""

s3:
  enabled: true
  endpoint: minio.lab.sspcloud.fr
  defaultRegion: us-east-1
  accessKeyId: ""
  secretAccessKey: ""
  sessionToken: ""
  workingDirectoryPath: ""

vault:
  enabled: true
  url: https://vault.lab.sspcloud.fr
  mount: onyxia-kv
  token: ""
  directory: ""

git:
  enabled: true
  name: ""
  email: ""
  token: ""

security:
  # Un seul identifiant pour tout le service (site web + connecteur MCP).
  #
  # Renseignee par install.sh, qui relit la cle deja en place ou en genere
  # une au format qgis_{utilisateur}_{aleatoire}. La passer en value la rend
  # visible dans Onyxia > Mes services et dans les notes d'installation :
  # l'utilisateur la retrouve sans aucune commande, comme le mot de passe
  # du chart Jupyter officiel.
  #
  # Laisser vide reste possible : le chart tire alors une cle au sort, mais
  # elle n'est plus consultable que via `kubectl get secret`.
  apiKey: ""
  networkPolicy:
    enabled: true
    from:
      - ipBlock:
          cidr: 10.233.103.0/32
      - ipBlock:
          cidr: 10.233.111.0/32
      - ipBlock:
          cidr: 10.233.116.0/32
      - ipBlock:
          cidr: 10.233.108.0/32

global:
  suspend: false

message:
  fr: "**NB:** ce service pourrait être supprimé après 7 jours d'utilisation."
  en: "**Warning:** this service may be deleted after 7 days."

# ── Sprint Day 5 Phase 1.2 : nouveaux blocs agent + workspace + llm ──────────

# Agent LLM (chat + tool-runner)
agent:
  enabled: true
  image:
    repository: ghcr.io/nic01asfr/qgis-agent
    tag: latest
    pullPolicy: Always
  persistence:
    size: 10Gi
  ingress:
    enabled: true
    # Hostname derive du hub hostname par defaut (user-X-qgis-agent.*)
    hostname: ""
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi

# Workspace QGIS Desktop (noVNC + BigQgisMCP)
workspace:
  enabled: true
  image:
    repository: ghcr.io/nic01asfr/qgisremotemcp
    tag: latest
    pullPolicy: Always
  persistence:
    size: 10Gi
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: 2000m
      memory: 4Gi

# Assistant IA (SSPCloud llm.lab.sspcloud.fr par defaut, ou compatible OpenAI).
#
# Trois sources possibles, par ordre de priorite decroissante :
#   1. UI Onyxia  -- x-onyxia resout {{ai.activeProvider.*}} depuis le profil
#      utilisateur (Mon compte > Assistant IA). Automatique.
#   2. install.sh -- lit le meme profil dans Vault
#      (onyxia-kv/{user}/.onyxia/userProfileStr) et remplit ces valeurs.
#   3. Formulaire /workspace -- l'utilisateur colle sa cle a la main.
#
# Dans les trois cas la cle atterrit dans le Secret K8s `qgis-llm-apikey`
# (cf. secret-llm-apikey.yaml), lu par l'agent via secretKeyRef. Elle
# survit donc aux redemarrages de pod et aux `helm upgrade`.
#
# Laisser apiKey vide ici ne casse rien : le Secret n'est alors pas cree
# par le chart, et une cle deja saisie via le formulaire est preservee.
llm:
  # Format historique Onyxia (user.profile.aiAssistant.*) : c'est celui
  # qui est reellement alimente aujourd'hui. Prioritaire.
  apiKey: ""
  baseUrl: "https://llm.lab.sspcloud.fr/api"
  model: ""
  # Format recent Onyxia (ai.activeProvider.*) : utilise en repli si le
  # format historique est vide. Voir _helpers.tpl pour la fusion.
  provider:
    apiKey: ""
    apiBase: ""
    selectedModel: ""
